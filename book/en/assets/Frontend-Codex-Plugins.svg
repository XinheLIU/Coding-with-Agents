  <text x="985" y="620" text-anchor="middle" font-size="13" fill="#8a8a7e" font-style="italic">Keep fixing until "a design agency would sign off"</text>
  <text x="655" y="660" text-anchor="middle" font-size="14" fill="#8a8a7e" font-style="italic">"Functional QA does not count as fidelity QA": clicks and builds cannot replace comparing concept and screenshot</text>
