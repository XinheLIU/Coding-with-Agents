  <rect x="1075" y="480" width="180" height="56" rx="10" fill="#f8f1e4" stroke="#b07d2b" stroke-width="1.5"/>
  <text x="1165.0" y="512.9" text-anchor="middle" font-size="14" fill="#8a5f1a">Compare + ledger</text>
  <line x1="1052" y1="508" x2="1073" y2="508" stroke="#8a8a7e" stroke-width="2" marker-end="url(#arrow)"/>
