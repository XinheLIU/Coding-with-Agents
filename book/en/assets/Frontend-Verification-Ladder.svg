<svg xmlns="http://www.w3.org/2000/svg" width="1310" height="620" viewBox="0 0 1310 620" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#8a8a7e"/>
    </marker>
  </defs>
  <rect width="1310" height="620" fill="#ffffff"/>
  <text x="655" y="40" text-anchor="middle" font-size="20" fill="#2b2b2b" font-weight="700">The verification ladder: push each problem to the lowest rung that catches it</text>
  <rect x="250" y="510" width="810" height="58" rx="10" fill="#e9f3ee" stroke="#3d8b70" stroke-width="1.5"/>
  <circle cx="282" cy="539" r="17" fill="#ffffff" stroke="#3d8b70" stroke-width="1.5"/>
  <text x="282" y="545" text-anchor="middle" font-size="16" fill="#1f6a51" font-weight="700">1</text>
  <text x="318" y="545" text-anchor="start" font-size="17" fill="#1f6a51" font-weight="700">Type check + lint</text>
  <text x="700" y="545" text-anchor="middle" font-size="14" fill="#2b2b2b">Typos, props, raw colors, off-list components</text>
  <text x="1040" y="545" text-anchor="end" font-size="14" fill="#1f6a51">Seconds</text>
  <rect x="250" y="436" width="810" height="58" rx="10" fill="#e9f3ee" stroke="#3d8b70" stroke-width="1.5"/>
  <circle cx="282" cy="465" r="17" fill="#ffffff" stroke="#3d8b70" stroke-width="1.5"/>
  <text x="282" y="471" text-anchor="middle" font-size="16" fill="#1f6a51" font-weight="700">2</text>
  <text x="318" y="471" text-anchor="start" font-size="17" fill="#1f6a51" font-weight="700">Pure-logic unit tests</text>
  <text x="700" y="471" text-anchor="middle" font-size="14" fill="#2b2b2b">reducers · state machines · hooks</text>
  <text x="1040" y="471" text-anchor="end" font-size="14" fill="#1f6a51">Seconds</text>
  <rect x="250" y="362" width="810" height="58" rx="10" fill="#e9f3ee" stroke="#3d8b70" stroke-width="1.5"/>
  <circle cx="282" cy="391" r="17" fill="#ffffff" stroke="#3d8b70" stroke-width="1.5"/>
  <text x="282" y="397" text-anchor="middle" font-size="16" fill="#1f6a51" font-weight="700">3</text>
  <text x="318" y="397" text-anchor="start" font-size="17" fill="#1f6a51" font-weight="700">Component tests / Stories</text>
  <text x="700" y="397" text-anchor="middle" font-size="14" fill="#2b2b2b">One component across props and states</text>
  <text x="1040" y="397" text-anchor="end" font-size="14" fill="#1f6a51">Tens of seconds</text>
  <rect x="250" y="288" width="810" height="58" rx="10" fill="#eef2f7" stroke="#5a7aa6" stroke-width="1.5"/>
  <circle cx="282" cy="317" r="17" fill="#ffffff" stroke="#5a7aa6" stroke-width="1.5"/>
  <text x="282" y="323" text-anchor="middle" font-size="16" fill="#3c5a85" font-weight="700">4</text>
  <text x="318" y="323" text-anchor="start" font-size="17" fill="#3c5a85" font-weight="700">Browser verification</text>
  <text x="700" y="323" text-anchor="middle" font-size="14" fill="#2b2b2b">Page integration · breakpoints · API wiring</text>
  <text x="1040" y="323" text-anchor="end" font-size="14" fill="#3c5a85">Minutes</text>
  <rect x="250" y="214" width="810" height="58" rx="10" fill="#eef2f7" stroke="#5a7aa6" stroke-width="1.5"/>
  <circle cx="282" cy="243" r="17" fill="#ffffff" stroke="#5a7aa6" stroke-width="1.5"/>
  <text x="282" y="249" text-anchor="middle" font-size="16" fill="#3c5a85" font-weight="700">5</text>
  <text x="318" y="249" text-anchor="start" font-size="17" fill="#3c5a85" font-weight="700">Visual regression</text>
  <text x="700" y="249" text-anchor="middle" font-size="14" fill="#2b2b2b">Screenshot diff: what changed that should not</text>
  <text x="1040" y="249" text-anchor="end" font-size="14" fill="#3c5a85">Minutes</text>
  <rect x="250" y="140" width="810" height="58" rx="10" fill="#f8f1e4" stroke="#b07d2b" stroke-width="1.5"/>
  <circle cx="282" cy="169" r="17" fill="#ffffff" stroke="#b07d2b" stroke-width="1.5"/>
  <text x="282" y="175" text-anchor="middle" font-size="16" fill="#8a5f1a" font-weight="700">6</text>
  <text x="318" y="175" text-anchor="start" font-size="17" fill="#8a5f1a" font-weight="700">Human aesthetic judgment</text>
  <text x="700" y="175" text-anchor="middle" font-size="14" fill="#2b2b2b">Tone · meaning · does it look good</text>
  <text x="1040" y="175" text-anchor="end" font-size="14" fill="#8a5f1a">Up to you</text>
  <line x1="200" y1="560" x2="200" y2="80" stroke="#8a8a7e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="185" y="320" text-anchor="end" font-size="15" fill="#8a8a7e">Cost</text>
  <text x="185" y="342" text-anchor="end" font-size="15" fill="#8a8a7e">and latency</text>
  <path d="M 1100 140 L 1100 300" fill="none" stroke="#8a8a7e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1118" y="200" text-anchor="start" font-size="15" fill="#1f6a51" font-weight="700">Rule 1</text>
  <text x="1118" y="222" text-anchor="start" font-size="14" fill="#1f6a51">Push down: if a lower</text>
  <text x="1118" y="242" text-anchor="start" font-size="14" fill="#1f6a51">rung catches it, use it</text>
  <path d="M 1100 560 L 1100 380" fill="none" stroke="#8a8a7e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1118" y="440" text-anchor="start" font-size="15" fill="#3c5a85" font-weight="700">Rule 2</text>
  <text x="1118" y="462" text-anchor="start" font-size="14" fill="#3c5a85">Climb in order:</text>
  <text x="1118" y="482" text-anchor="start" font-size="14" fill="#3c5a85">browser after logic</text>
  <text x="80" y="160" text-anchor="start" font-size="15" fill="#8a5f1a" font-weight="700">Humans stand</text>
  <text x="80" y="182" text-anchor="start" font-size="15" fill="#8a5f1a" font-weight="700">only here</text>
  <text x="80" y="470" text-anchor="start" font-size="15" fill="#1f6a51" font-weight="700">Agent</text>
  <text x="80" y="492" text-anchor="start" font-size="15" fill="#1f6a51" font-weight="700">runs these</text>
  <text x="655" y="605" text-anchor="middle" font-size="14" fill="#8a8a7e" font-style="italic">If you are hand-clicking to find bugs, a rung is missing: add the ruler, stop clicking</text>
</svg>
