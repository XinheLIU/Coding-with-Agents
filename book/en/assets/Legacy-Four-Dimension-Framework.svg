<svg xmlns="http://www.w3.org/2000/svg" width="1310" height="300" viewBox="0 0 1310 300" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif">
  <rect width="1310" height="300" fill="#ffffff"/>

  <!-- Card 1: Position & boundary (purple) -->
  <rect x="40" y="40" width="295" height="230" rx="14" fill="#f4f1fe" stroke="#9b8cf0" stroke-width="1.5"/>
  <text x="187" y="80" text-anchor="middle" font-size="17" font-weight="700" fill="#2b2b2b">Position &amp; boundary</text>
  <line x1="157" y1="96" x2="217" y2="96" stroke="#9b8cf0" stroke-width="2"/>
  <text x="187" y="128" text-anchor="middle" font-size="13.5" fill="#6a58c9">What problem does it solve,</text>
  <text x="187" y="150" text-anchor="middle" font-size="13.5" fill="#6a58c9">what does it refuse to solve,</text>
  <text x="187" y="172" text-anchor="middle" font-size="13.5" fill="#6a58c9">how does it compare?</text>
  <text x="187" y="212" text-anchor="middle" font-size="12.5" font-style="italic" fill="#8a8a7e">→ one-line positioning + boundaries</text>

  <!-- Card 2: Native capability (green) -->
  <rect x="350" y="40" width="295" height="230" rx="14" fill="#e9f6f0" stroke="#4bab8d" stroke-width="1.5"/>
  <text x="497" y="80" text-anchor="middle" font-size="17" font-weight="700" fill="#2b2b2b">Native capability</text>
  <line x1="467" y1="96" x2="527" y2="96" stroke="#4bab8d" stroke-width="2"/>
  <text x="497" y="128" text-anchor="middle" font-size="13.5" fill="#2e7d5f">What ships in the box,</text>
  <text x="497" y="150" text-anchor="middle" font-size="13.5" fill="#2e7d5f">what works without code,</text>
  <text x="497" y="172" text-anchor="middle" font-size="13.5" fill="#2e7d5f">how deep is the coverage?</text>
  <text x="497" y="212" text-anchor="middle" font-size="12.5" font-style="italic" fill="#8a8a7e">→ supported / partial / unsupported</text>

  <!-- Card 3: Extension model (blue) -->
  <rect x="660" y="40" width="295" height="230" rx="14" fill="#e8f2fc" stroke="#6ea8dc" stroke-width="1.5"/>
  <text x="807" y="80" text-anchor="middle" font-size="17" font-weight="700" fill="#2b2b2b">Extension model</text>
  <line x1="777" y1="96" x2="837" y2="96" stroke="#6ea8dc" stroke-width="2"/>
  <text x="807" y="128" text-anchor="middle" font-size="13.5" fill="#2b6cb0">What is the mechanism,</text>
  <text x="807" y="150" text-anchor="middle" font-size="13.5" fill="#2b6cb0">what do the extension points</text>
  <text x="807" y="172" text-anchor="middle" font-size="13.5" fill="#2b6cb0">look like, what is the idiom?</text>
  <text x="807" y="212" text-anchor="middle" font-size="12.5" font-style="italic" fill="#8a8a7e">→ extension-point map + skeleton</text>

  <!-- Card 4: Internal mechanics (orange) -->
  <rect x="970" y="40" width="295" height="230" rx="14" fill="#fdf4e3" stroke="#d9a648" stroke-width="1.5"/>
  <text x="1117" y="80" text-anchor="middle" font-size="17" font-weight="700" fill="#2b2b2b">Internal mechanics</text>
  <line x1="1087" y1="96" x2="1147" y2="96" stroke="#d9a648" stroke-width="2"/>
  <text x="1117" y="128" text-anchor="middle" font-size="13.5" fill="#9c6d1f">How does it start and run,</text>
  <text x="1117" y="150" text-anchor="middle" font-size="13.5" fill="#9c6d1f">how is state managed,</text>
  <text x="1117" y="172" text-anchor="middle" font-size="13.5" fill="#9c6d1f">what are the surfaces?</text>
  <text x="1117" y="212" text-anchor="middle" font-size="12.5" font-style="italic" fill="#8a8a7e">→ process / state / config model</text>
</svg>
