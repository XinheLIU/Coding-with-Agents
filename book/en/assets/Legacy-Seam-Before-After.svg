<svg xmlns="http://www.w3.org/2000/svg" width="1310" height="430" viewBox="0 0 1310 430" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif">
  <rect width="1310" height="430" fill="#ffffff"/>

  <text x="320" y="44" text-anchor="middle" font-size="20" font-weight="700" fill="#2b2b2b">Without a seam</text>
  <text x="990" y="44" text-anchor="middle" font-size="20" font-weight="700" fill="#2b2b2b">With a seam</text>

  <line x1="655" y1="30" x2="655" y2="410" stroke="#cfcfc0" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- Left panel: direct dependencies -->
  <rect x="40" y="64" width="560" height="340" rx="16" fill="#f7f7ee" stroke="#cfcfc0" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="320" y="100" text-anchor="middle" font-size="15" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#2b2b2b">def calculate_price(order):</text>

  <rect x="60" y="122" width="520" height="44" rx="10" fill="#fdf0ef" stroke="#c0564f" stroke-width="1.5"/>
  <text x="320" y="149" text-anchor="middle" font-size="13.5" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#b5453c">datetime.now() — the real clock</text>

  <rect x="60" y="180" width="520" height="44" rx="10" fill="#fdf0ef" stroke="#c0564f" stroke-width="1.5"/>
  <text x="320" y="207" text-anchor="middle" font-size="13.5" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#b5453c">requests.get(RATE_API) — the real network</text>

  <rect x="60" y="238" width="520" height="44" rx="10" fill="#fdf0ef" stroke="#c0564f" stroke-width="1.5"/>
  <text x="320" y="265" text-anchor="middle" font-size="13.5" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#b5453c">database.query(id) — the real database</text>

  <text x="320" y="336" text-anchor="middle" font-size="14" font-style="italic" fill="#b5453c">slow, flaky tests — the logic you want to test is buried</text>
  <text x="320" y="358" text-anchor="middle" font-size="14" font-style="italic" fill="#b5453c">under the clock, the network, and the database</text>

  <!-- Right panel: injected dependencies -->
  <rect x="710" y="64" width="560" height="340" rx="16" fill="#f7f7ee" stroke="#cfcfc0" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="990" y="100" text-anchor="middle" font-size="15" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#2b2b2b">Pricing(accounts, rates, clock)</text>

  <rect x="730" y="122" width="520" height="44" rx="10" fill="#e9f3ee" stroke="#3d8b70" stroke-width="1.5"/>
  <text x="990" y="149" text-anchor="middle" font-size="13.5" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#1f6a51">clock=FixedClock("2026-07-25")</text>

  <rect x="730" y="180" width="520" height="44" rx="10" fill="#e9f3ee" stroke="#3d8b70" stroke-width="1.5"/>
  <text x="990" y="207" text-anchor="middle" font-size="13.5" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#1f6a51">rates=FixedRates(1.2)</text>

  <rect x="730" y="238" width="520" height="44" rx="10" fill="#e9f3ee" stroke="#3d8b70" stroke-width="1.5"/>
  <text x="990" y="265" text-anchor="middle" font-size="13.5" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#1f6a51">accounts=FakeAccounts(...)</text>

  <text x="990" y="336" text-anchor="middle" font-size="14" font-style="italic" fill="#1f6a51">substitutable · observable · revertible</text>
  <text x="990" y="358" text-anchor="middle" font-size="13" font-style="italic" fill="#8a8a7e">production wires the real thing; tests wire what you control</text>
</svg>
