<svg xmlns="http://www.w3.org/2000/svg" width="1310" height="510" viewBox="0 0 1310 510" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#8a8a7e"/>
    </marker>
  </defs>

  <rect width="1310" height="510" fill="#ffffff"/>

  <!-- Panel 1: Comprehension -->
  <rect x="40" y="40" width="330" height="350" rx="16" fill="#f7f7ee" stroke="#cfcfc0" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="205" y="84" text-anchor="middle" font-size="19" font-weight="700" fill="#2b2b2b">Layer 1 · Comprehension</text>
  <text x="205" y="108" text-anchor="middle" font-size="14" font-style="italic" fill="#8a8a7e">Make the agent see</text>

  <rect x="60" y="140" width="290" height="44" rx="10" fill="#e9f3ee" stroke="#3d8b70" stroke-width="1.5"/>
  <text x="205" y="167" text-anchor="middle" font-size="15" fill="#1f6a51">docs/ — diagrams &amp; runbooks</text>

  <rect x="60" y="198" width="290" height="44" rx="10" fill="#e9f3ee" stroke="#3d8b70" stroke-width="1.5"/>
  <text x="205" y="225" text-anchor="middle" font-size="15" fill="#1f6a51">Interface &amp; data-model inventory</text>

  <rect x="60" y="256" width="290" height="44" rx="10" fill="#e9f3ee" stroke="#3d8b70" stroke-width="1.5"/>
  <text x="205" y="283" text-anchor="middle" font-size="15" fill="#1f6a51">Repository graphs &amp; IDE navigation</text>

  <rect x="60" y="314" width="290" height="44" rx="10" fill="#e9f3ee" stroke="#3d8b70" stroke-width="1.5"/>
  <text x="205" y="341" text-anchor="middle" font-size="15" fill="#1f6a51">History tracing &amp; MCP context</text>

  <!-- Arrow 1 -->
  <text x="430" y="182" text-anchor="middle" font-size="13" fill="#8a8a7e">sets how precise</text>
  <text x="430" y="200" text-anchor="middle" font-size="13" fill="#8a8a7e">rules can be</text>
  <line x1="376" y1="215" x2="482" y2="215" stroke="#8a8a7e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Panel 2: Constraint -->
  <rect x="490" y="40" width="330" height="350" rx="16" fill="#f7f7ee" stroke="#cfcfc0" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="655" y="84" text-anchor="middle" font-size="19" font-weight="700" fill="#2b2b2b">Layer 2 · Constraint</text>
  <text x="655" y="108" text-anchor="middle" font-size="14" font-style="italic" fill="#8a8a7e">Make the agent obey</text>

  <rect x="510" y="140" width="290" height="44" rx="10" fill="#e9f3ee" stroke="#3d8b70" stroke-width="1.5"/>
  <text x="655" y="167" text-anchor="middle" font-size="15" fill="#1f6a51">AGENTS.md: index + common sense</text>

  <rect x="510" y="198" width="290" height="44" rx="10" fill="#e9f3ee" stroke="#3d8b70" stroke-width="1.5"/>
  <text x="655" y="225" text-anchor="middle" font-size="15" fill="#1f6a51">Forbidden zones &amp; baggage</text>

  <rect x="510" y="256" width="290" height="44" rx="10" fill="#e9f3ee" stroke="#3d8b70" stroke-width="1.5"/>
  <text x="655" y="283" text-anchor="middle" font-size="15" fill="#1f6a51">Skills for repeated processes</text>

  <rect x="510" y="314" width="290" height="44" rx="10" fill="#e9f3ee" stroke="#3d8b70" stroke-width="1.5"/>
  <text x="655" y="341" text-anchor="middle" font-size="15" fill="#1f6a51">Lightweight specs (OpenSpec)</text>

  <!-- Arrow 2 -->
  <text x="880" y="182" text-anchor="middle" font-size="13" fill="#8a8a7e">defines what</text>
  <text x="880" y="200" text-anchor="middle" font-size="13" fill="#8a8a7e">gets checked</text>
  <line x1="826" y1="215" x2="932" y2="215" stroke="#8a8a7e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Panel 3: Verification -->
  <rect x="940" y="40" width="330" height="350" rx="16" fill="#f7f7ee" stroke="#cfcfc0" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="1105" y="84" text-anchor="middle" font-size="19" font-weight="700" fill="#2b2b2b">Layer 3 · Verification</text>
  <text x="1105" y="108" text-anchor="middle" font-size="14" font-style="italic" fill="#8a8a7e">Make the agent checkable</text>

  <rect x="960" y="140" width="290" height="44" rx="10" fill="#e9f3ee" stroke="#3d8b70" stroke-width="1.5"/>
  <text x="1105" y="167" text-anchor="middle" font-size="15" fill="#1f6a51">Characterization tests</text>

  <rect x="960" y="198" width="290" height="44" rx="10" fill="#e9f3ee" stroke="#3d8b70" stroke-width="1.5"/>
  <text x="1105" y="225" text-anchor="middle" font-size="15" fill="#1f6a51">Seams &amp; incremental refactoring</text>

  <rect x="960" y="256" width="290" height="44" rx="10" fill="#e9f3ee" stroke="#3d8b70" stroke-width="1.5"/>
  <text x="1105" y="283" text-anchor="middle" font-size="15" fill="#1f6a51">Quality baseline: Sonar + CodeQL</text>

  <rect x="960" y="314" width="290" height="44" rx="10" fill="#e9f3ee" stroke="#3d8b70" stroke-width="1.5"/>
  <text x="1105" y="341" text-anchor="middle" font-size="15" fill="#1f6a51">CI gates &amp; cross-model review</text>

  <!-- Feedback arrow -->
  <path d="M 1105 390 L 1105 445 L 205 445 L 205 398" fill="none" stroke="#8a8a7e" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="655" y="472" text-anchor="middle" font-size="13" font-style="italic" fill="#8a8a7e">verification findings feed back — a regression becomes a new rule and new understanding</text>
</svg>
