  <text x="225" y="382" text-anchor="middle" font-size="15" fill="#8a5f1a" font-weight="700">Pure visual exploration</text>
  <text x="225" y="408" text-anchor="middle" font-size="14" fill="#8a5f1a">Variants + human picks</text>
  <rect x="380" y="350" width="270" height="80" rx="10" fill="#f8f1e4" stroke="#b07d2b" stroke-width="1.5"/>
  <text x="515" y="382" text-anchor="middle" font-size="15" fill="#8a5f1a" font-weight="700">Type checks only</text>
  <text x="515" y="408" text-anchor="middle" font-size="14" fill="#8a5f1a">Add rulers first, then let go</text>
  <rect x="670" y="350" width="270" height="80" rx="10" fill="#eef2f7" stroke="#5a7aa6" stroke-width="1.5"/>
  <text x="805" y="382" text-anchor="middle" font-size="15" fill="#3c5a85" font-weight="700">+ unit + browser tests</text>
  <text x="805" y="408" text-anchor="middle" font-size="14" fill="#3c5a85">Small commits, check screenshots</text>
  <rect x="960" y="350" width="270" height="80" rx="10" fill="#e9f3ee" stroke="#3d8b70" stroke-width="1.5"/>
  <text x="1095" y="382" text-anchor="middle" font-size="15" fill="#1f6a51" font-weight="700">+ visual regression</text>
  <text x="1095" y="408" text-anchor="middle" font-size="14" fill="#1f6a51">Safe to run long and unattended</text>
