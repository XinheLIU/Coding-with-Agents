<svg xmlns="http://www.w3.org/2000/svg" width="1310" height="500" viewBox="0 0 1310 500" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#8a8a7e"/>
    </marker>
  </defs>
  <rect width="1310" height="500" fill="#ffffff"/>
  <rect x="40" y="40" width="350" height="330" rx="16" fill="#f7f7ee" stroke="#cfcfc0" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="215" y="84" text-anchor="middle" font-size="21" fill="#2b2b2b" font-weight="700">① Structure</text>
  <text x="215" y="110" text-anchor="middle" font-size="15" fill="#555555">What does it look like?</text>
  <rect x="60" y="140" width="310" height="52" rx="10" fill="#eef2f7" stroke="#5a7aa6" stroke-width="1.5"/>
  <text x="215.0" y="170.9" text-anchor="middle" font-size="14" fill="#3c5a85">Reference screenshot</text>
  <rect x="60" y="206" width="310" height="52" rx="10" fill="#eef2f7" stroke="#5a7aa6" stroke-width="1.5"/>
  <text x="215.0" y="236.9" text-anchor="middle" font-size="14" fill="#3c5a85">Hand sketch (boxes are enough)</text>
  <rect x="60" y="290" width="310" height="52" rx="10" fill="#e9f3ee" stroke="#3d8b70" stroke-width="1.5"/>
  <text x="215.0" y="320.9" text-anchor="middle" font-size="14" fill="#1f6a51">Gate: agent restates → you confirm</text>
  <rect x="480" y="40" width="350" height="330" rx="16" fill="#f7f7ee" stroke="#cfcfc0" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="655" y="84" text-anchor="middle" font-size="21" fill="#2b2b2b" font-weight="700">② Behavior</text>
  <text x="655" y="110" text-anchor="middle" font-size="15" fill="#555555">How does it move?</text>
  <rect x="500" y="140" width="310" height="52" rx="10" fill="#eef2f7" stroke="#5a7aa6" stroke-width="1.5"/>
  <text x="655.0" y="170.9" text-anchor="middle" font-size="14" fill="#3c5a85">Static: layout · data · interaction · API</text>
  <rect x="500" y="206" width="310" height="52" rx="10" fill="#eef2f7" stroke="#5a7aa6" stroke-width="1.5"/>
  <text x="655.0" y="236.9" text-anchor="middle" font-size="14" fill="#3c5a85">Dynamic: timeline + explicit constraints</text>
  <rect x="500" y="290" width="310" height="52" rx="10" fill="#e9f3ee" stroke="#3d8b70" stroke-width="1.5"/>
  <text x="655.0" y="320.9" text-anchor="middle" font-size="14" fill="#1f6a51">Gate: runs and is ~80–90% right</text>
  <rect x="920" y="40" width="350" height="330" rx="16" fill="#f7f7ee" stroke="#cfcfc0" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="1095" y="84" text-anchor="middle" font-size="21" fill="#2b2b2b" font-weight="700">③ Detail</text>
  <text x="1095" y="110" text-anchor="middle" font-size="15" fill="#555555">What's off?</text>
  <rect x="940" y="140" width="310" height="52" rx="10" fill="#eef2f7" stroke="#5a7aa6" stroke-width="1.5"/>
  <text x="1095.0" y="170.9" text-anchor="middle" font-size="14" fill="#3c5a85">One dimension per round</text>
  <rect x="940" y="206" width="310" height="52" rx="10" fill="#eef2f7" stroke="#5a7aa6" stroke-width="1.5"/>
  <text x="1095.0" y="236.9" text-anchor="middle" font-size="14" fill="#3c5a85">Was → becomes; leave the rest</text>
  <rect x="940" y="290" width="310" height="52" rx="10" fill="#e9f3ee" stroke="#3d8b70" stroke-width="1.5"/>
  <text x="1095.0" y="320.9" text-anchor="middle" font-size="14" fill="#1f6a51">Gate: look once per round</text>
  <line x1="396" y1="205" x2="474" y2="205" stroke="#8a8a7e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="836" y1="205" x2="914" y2="205" stroke="#8a8a7e" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="240" y="400" width="830" height="60" rx="10" fill="#fbeeee" stroke="#b85450" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="655" y="436" text-anchor="middle" font-size="15" fill="#8f3b38">Out of order: polished details on the wrong layout → rework the whole page</text>
</svg>
