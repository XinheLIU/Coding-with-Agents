  </defs>
  <rect width="1310" height="640" fill="#ffffff"/>
  <text x="655" y="40" text-anchor="middle" font-size="20" fill="#2b2b2b" font-weight="700">Google's pipeline: design in Stitch, contract in DESIGN.md, build in Antigravity</text>
  <rect x="40" y="70" width="230" height="400" rx="16" fill="#f7f7ee" stroke="#cfcfc0" stroke-width="1.5" stroke-dasharray="6 5"/>
