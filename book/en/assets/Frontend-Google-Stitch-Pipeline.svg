  <rect x="60" y="188" width="190" height="50" rx="10" fill="#f2f2f2" stroke="#b5b5b5" stroke-width="1.5"/>
  <text x="155.0" y="217.9" text-anchor="middle" font-size="14" fill="#777777">Sketch · screenshot</text>
  <rect x="60" y="252" width="190" height="50" rx="10" fill="#f2f2f2" stroke="#b5b5b5" stroke-width="1.5"/>
  <text x="155.0" y="281.9" text-anchor="middle" font-size="14" fill="#777777">Existing codebase</text>
  <rect x="60" y="316" width="190" height="50" rx="10" fill="#f2f2f2" stroke="#b5b5b5" stroke-width="1.5"/>
  <text x="155.0" y="345.9" text-anchor="middle" font-size="14" fill="#777777">Design files</text>
  <rect x="320" y="70" width="300" height="400" rx="16" fill="#eef2f7" stroke="#5a7aa6" stroke-width="2"/>
  <text x="470" y="104" text-anchor="middle" font-size="17" fill="#3c5a85" font-weight="700">Stitch (design side)</text>
  <rect x="340" y="124" width="260" height="68" rx="10" fill="#eef2f7" stroke="#5a7aa6" stroke-width="1.5"/>
