  <text x="940" y="132" text-anchor="start" font-size="13" fill="#555555">Local agent IDE: adds backend logic</text>
  <text x="940" y="152" text-anchor="start" font-size="13" fill="#8a8a7e">Browser subagent self-tests · recordings</text>
  <line x1="862" y1="270" x2="916" y2="122" stroke="#8a8a7e" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="920" y="178" width="350" height="84" rx="10" fill="#eef2f7" stroke="#5a7aa6" stroke-width="1.5"/>
  <text x="940" y="206" text-anchor="start" font-size="16" fill="#3c5a85" font-weight="700">AI Studio</text>
  <text x="940" y="230" text-anchor="start" font-size="13" fill="#555555">Wires in Gemini capabilities</text>
  <text x="940" y="250" text-anchor="start" font-size="13" fill="#8a8a7e">Shareable prototype link</text>
  <line x1="862" y1="270" x2="916" y2="220" stroke="#8a8a7e" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="920" y="276" width="350" height="84" rx="10" fill="#f2f2f2" stroke="#b5b5b5" stroke-width="1.5"/>
  <text x="940" y="304" text-anchor="start" font-size="16" fill="#777777" font-weight="700">Netlify</text>
  <text x="940" y="328" text-anchor="start" font-size="13" fill="#555555">Publish directly</text>
  <text x="940" y="348" text-anchor="start" font-size="13" fill="#8a8a7e">Static sites / marketing pages</text>
  <line x1="862" y1="270" x2="916" y2="318" stroke="#8a8a7e" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="920" y="374" width="350" height="84" rx="10" fill="#f8f1e4" stroke="#b07d2b" stroke-width="1.5"/>
  <text x="940" y="402" text-anchor="start" font-size="16" fill="#8a5f1a" font-weight="700">Other agents</text>
  <text x="940" y="426" text-anchor="start" font-size="13" fill="#555555">stitch-skills + Stitch MCP</text>
  <text x="940" y="446" text-anchor="start" font-size="13" fill="#8a8a7e">Claude Code · Codex · Cursor</text>
  <line x1="862" y1="270" x2="916" y2="416" stroke="#8a8a7e" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="320" y="500" width="950" height="62" rx="12" fill="#f7f7ee" stroke="#cfcfc0" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="795" y="528" text-anchor="middle" font-size="15" fill="#555555">Chrome runs through it all: DevTools MCP lets any agent read DOM, console and perf traces</text>
  <text x="795" y="550" text-anchor="middle" font-size="13" fill="#8a8a7e">Gemini's multimodality (screenshots, video) is what lets every stage see</text>
  <text x="655" y="610" text-anchor="middle" font-size="14" fill="#8a8a7e" font-style="italic">Google bets on the upstream: whoever produces DESIGN.md owns the design source of truth; downstream is its own IDE, but open to others</text>
</svg>
