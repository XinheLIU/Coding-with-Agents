  <text x="470.0" y="173.4" text-anchor="middle" font-size="14" fill="#3c5a85">Screens · variants side by side</text>
  <rect x="340" y="206" width="260" height="68" rx="10" fill="#eef2f7" stroke="#5a7aa6" stroke-width="1.5"/>
  <text x="470.0" y="234.4" text-anchor="middle" font-size="14" fill="#3c5a85" font-weight="700">Stitch Agent</text>
  <text x="470.0" y="255.4" text-anchor="middle" font-size="14" fill="#3c5a85">Generates live on the canvas</text>
  <rect x="340" y="288" width="260" height="68" rx="10" fill="#eef2f7" stroke="#5a7aa6" stroke-width="1.5"/>
  <text x="470.0" y="316.4" text-anchor="middle" font-size="14" fill="#3c5a85" font-weight="700">Stitch MCP + SDK</text>
  <text x="470.0" y="337.4" text-anchor="middle" font-size="14" fill="#3c5a85">Callable by any agent</text>
  <rect x="340" y="370" width="260" height="68" rx="10" fill="#eef2f7" stroke="#5a7aa6" stroke-width="1.5"/>
  <text x="470.0" y="398.4" text-anchor="middle" font-size="14" fill="#3c5a85" font-weight="700">code-to-design</text>
  <text x="470.0" y="419.4" text-anchor="middle" font-size="14" fill="#3c5a85">Turns code back into design</text>
  <line x1="272" y1="270" x2="316" y2="270" stroke="#8a8a7e" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="670" y="210" width="190" height="120" rx="14" fill="#e9f3ee" stroke="#3d8b70" stroke-width="2"/>
  <text x="765" y="248" text-anchor="middle" font-size="19" fill="#1f6a51" font-weight="700">DESIGN.md</text>
  <text x="765" y="274" text-anchor="middle" font-size="14" fill="#1f6a51">Token + Why</text>
  <text x="765" y="298" text-anchor="middle" font-size="13" fill="#8a8a7e">Open spec · lint</text>
  <line x1="622" y1="270" x2="666" y2="270" stroke="#8a8a7e" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="920" y="80" width="350" height="84" rx="10" fill="#e9f3ee" stroke="#3d8b70" stroke-width="1.5"/>
