  </defs>
  <rect width="1310" height="470" fill="#ffffff"/>
  <text x="655" y="40" text-anchor="middle" font-size="20" fill="#2b2b2b" font-weight="700">前端代码库里，真正「盲飞」的只是一条窄带</text>
  <text x="60" y="100" text-anchor="start" font-size="15" fill="#555555" font-weight="700">收窄之前</text>
  <rect x="60" y="115" width="180" height="80" rx="10" fill="#e9f3ee" stroke="#3d8b70" stroke-width="1.5"/>
