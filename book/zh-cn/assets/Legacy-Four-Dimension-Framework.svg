<svg xmlns="http://www.w3.org/2000/svg" width="1310" height="300" viewBox="0 0 1310 300" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif">
  <rect width="1310" height="300" fill="#ffffff"/>

  <!-- Card 1: Position & boundary (purple) -->
  <rect x="40" y="40" width="295" height="230" rx="14" fill="#f4f1fe" stroke="#9b8cf0" stroke-width="1.5"/>
  <text x="187" y="80" text-anchor="middle" font-size="17" font-weight="700" fill="#2b2b2b">定位与边界</text>
  <line x1="157" y1="96" x2="217" y2="96" stroke="#9b8cf0" stroke-width="2"/>
  <text x="187" y="128" text-anchor="middle" font-size="13.5" fill="#6a58c9">它解决什么问题，</text>
  <text x="187" y="150" text-anchor="middle" font-size="13.5" fill="#6a58c9">明确拒绝什么，</text>
  <text x="187" y="172" text-anchor="middle" font-size="13.5" fill="#6a58c9">与同类工具相比如何？</text>
  <text x="187" y="212" text-anchor="middle" font-size="12.5" font-style="italic" fill="#8a8a7e">→ 一句话定位 + 边界</text>

  <!-- Card 2: Native capability (green) -->
  <rect x="350" y="40" width="295" height="230" rx="14" fill="#e9f6f0" stroke="#4bab8d" stroke-width="1.5"/>
  <text x="497" y="80" text-anchor="middle" font-size="17" font-weight="700" fill="#2b2b2b">原生能力</text>
  <line x1="467" y1="96" x2="527" y2="96" stroke="#4bab8d" stroke-width="2"/>
  <text x="497" y="128" text-anchor="middle" font-size="13.5" fill="#2e7d5f">开箱即用的内容，</text>
  <text x="497" y="150" text-anchor="middle" font-size="13.5" fill="#2e7d5f">无需写代码就能用的功能，</text>
  <text x="497" y="172" text-anchor="middle" font-size="13.5" fill="#2e7d5f">覆盖深度如何？</text>
  <text x="497" y="212" text-anchor="middle" font-size="12.5" font-style="italic" fill="#8a8a7e">→ 支持 / 部分支持 / 不支持</text>

  <!-- Card 3: Extension model (blue) -->
  <rect x="660" y="40" width="295" height="230" rx="14" fill="#e8f2fc" stroke="#6ea8dc" stroke-width="1.5"/>
  <text x="807" y="80" text-anchor="middle" font-size="17" font-weight="700" fill="#2b2b2b">扩展模型</text>
  <line x1="777" y1="96" x2="837" y2="96" stroke="#6ea8dc" stroke-width="2"/>
  <text x="807" y="128" text-anchor="middle" font-size="13.5" fill="#2b6cb0">扩展机制是什么，</text>
  <text x="807" y="150" text-anchor="middle" font-size="13.5" fill="#2b6cb0">扩展点长什么样，</text>
  <text x="807" y="172" text-anchor="middle" font-size="13.5" fill="#2b6cb0">开发范式是什么？</text>
  <text x="807" y="212" text-anchor="middle" font-size="12.5" font-style="italic" fill="#8a8a7e">→ 扩展点地图 + 最小骨架</text>

  <!-- Card 4: Internal mechanics (orange) -->
  <rect x="970" y="40" width="295" height="230" rx="14" fill="#fdf4e3" stroke="#d9a648" stroke-width="1.5"/>
  <text x="1117" y="80" text-anchor="middle" font-size="17" font-weight="700" fill="#2b2b2b">内部机制</text>
  <line x1="1087" y1="96" x2="1147" y2="96" stroke="#d9a648" stroke-width="2"/>
  <text x="1117" y="128" text-anchor="middle" font-size="13.5" fill="#9c6d1f">如何启动和运行，</text>
  <text x="1117" y="150" text-anchor="middle" font-size="13.5" fill="#9c6d1f">状态如何管理，</text>
  <text x="1117" y="172" text-anchor="middle" font-size="13.5" fill="#9c6d1f">集成面有哪些？</text>
  <text x="1117" y="212" text-anchor="middle" font-size="12.5" font-style="italic" fill="#8a8a7e">→ 进程 / 状态 / 配置模型</text>
</svg>
