  <text x="1105" y="341" text-anchor="middle" font-size="15" fill="#1f6a51">CI 门禁与跨模型审查</text>

  <!-- Feedback arrow -->
  <path d="M 1105 390 L 1105 445 L 205 445 L 205 398" fill="none" stroke="#8a8a7e" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="655" y="472" text-anchor="middle" font-size="13" font-style="italic" fill="#8a8a7e">验证发现反过来加深理解——一次回归会变成新的规则和新的认知</text>
