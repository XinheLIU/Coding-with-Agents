  <text x="205" y="108" text-anchor="middle" font-size="14" font-style="italic" fill="#8a8a7e">让智能体看见</text>

  <rect x="60" y="140" width="290" height="44" rx="10" fill="#e9f3ee" stroke="#3d8b70" stroke-width="1.5"/>
