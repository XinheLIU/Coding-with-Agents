  <rect x="60" y="198" width="290" height="44" rx="10" fill="#e9f3ee" stroke="#3d8b70" stroke-width="1.5"/>
  <text x="205" y="225" text-anchor="middle" font-size="15" fill="#1f6a51">接口与数据模型清单</text>

  <rect x="60" y="256" width="290" height="44" rx="10" fill="#e9f3ee" stroke="#3d8b70" stroke-width="1.5"/>
  <text x="205" y="283" text-anchor="middle" font-size="15" fill="#1f6a51">代码库图谱与 IDE 导航</text>

  <rect x="60" y="314" width="290" height="44" rx="10" fill="#e9f3ee" stroke="#3d8b70" stroke-width="1.5"/>
  <text x="205" y="341" text-anchor="middle" font-size="15" fill="#1f6a51">历史追踪与 MCP 上下文</text>

  <!-- Arrow 1 -->
  <text x="430" y="182" text-anchor="middle" font-size="13" fill="#8a8a7e">决定规则</text>
  <text x="430" y="200" text-anchor="middle" font-size="13" fill="#8a8a7e">能多精确</text>
  <line x1="376" y1="215" x2="482" y2="215" stroke="#8a8a7e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Panel 2: Constraint -->
  <rect x="490" y="40" width="330" height="350" rx="16" fill="#f7f7ee" stroke="#cfcfc0" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="655" y="84" text-anchor="middle" font-size="19" font-weight="700" fill="#2b2b2b">第 2 层 · 约束</text>
  <text x="655" y="108" text-anchor="middle" font-size="14" font-style="italic" fill="#8a8a7e">让智能体服从</text>

  <rect x="510" y="140" width="290" height="44" rx="10" fill="#e9f3ee" stroke="#3d8b70" stroke-width="1.5"/>
  <text x="655" y="167" text-anchor="middle" font-size="15" fill="#1f6a51">AGENTS.md：索引加常识</text>

  <rect x="510" y="198" width="290" height="44" rx="10" fill="#e9f3ee" stroke="#3d8b70" stroke-width="1.5"/>
  <text x="655" y="225" text-anchor="middle" font-size="15" fill="#1f6a51">禁区与历史包袱</text>

  <rect x="510" y="256" width="290" height="44" rx="10" fill="#e9f3ee" stroke="#3d8b70" stroke-width="1.5"/>
  <text x="655" y="283" text-anchor="middle" font-size="15" fill="#1f6a51">面向重复流程的 Skill</text>

  <rect x="510" y="314" width="290" height="44" rx="10" fill="#e9f3ee" stroke="#3d8b70" stroke-width="1.5"/>
  <text x="655" y="341" text-anchor="middle" font-size="15" fill="#1f6a51">轻量级规范（OpenSpec）</text>

  <!-- Arrow 2 -->
  <text x="880" y="182" text-anchor="middle" font-size="13" fill="#8a8a7e">决定验证</text>
  <text x="880" y="200" text-anchor="middle" font-size="13" fill="#8a8a7e">检查什么</text>
  <line x1="826" y1="215" x2="932" y2="215" stroke="#8a8a7e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Panel 3: Verification -->
  <rect x="940" y="40" width="330" height="350" rx="16" fill="#f7f7ee" stroke="#cfcfc0" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="1105" y="84" text-anchor="middle" font-size="19" font-weight="700" fill="#2b2b2b">第 3 层 · 验证</text>
  <text x="1105" y="108" text-anchor="middle" font-size="14" font-style="italic" fill="#8a8a7e">让智能体可检查</text>

  <rect x="960" y="140" width="290" height="44" rx="10" fill="#e9f3ee" stroke="#3d8b70" stroke-width="1.5"/>
  <text x="1105" y="167" text-anchor="middle" font-size="15" fill="#1f6a51">Characterization Test</text>

  <rect x="960" y="198" width="290" height="44" rx="10" fill="#e9f3ee" stroke="#3d8b70" stroke-width="1.5"/>
