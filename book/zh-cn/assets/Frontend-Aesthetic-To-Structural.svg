<svg xmlns="http://www.w3.org/2000/svg" width="1310" height="470" viewBox="0 0 1310 470" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#8a8a7e"/>
    </marker>
  </defs>
  <rect width="1310" height="470" fill="#ffffff"/>
  <rect x="40" y="40" width="400" height="380" rx="16" fill="#f7f7ee" stroke="#cfcfc0" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="240" y="84" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="700">主观问题</text>
  <text x="240" y="108" text-anchor="middle" font-size="14" fill="#8a8a7e" font-style="italic">只有人能判断</text>
  <rect x="70" y="170" width="340" height="110" rx="10" fill="#f8f1e4" stroke="#b07d2b" stroke-width="1.5"/>
  <text x="240.0" y="218.5" text-anchor="middle" font-size="20" fill="#8a5f1a">「这个页面</text>
  <text x="240.0" y="245.5" text-anchor="middle" font-size="20" fill="#8a5f1a">看起来对吗？」</text>
  <text x="240" y="330" text-anchor="middle" font-size="14" fill="#8a5f1a">慢、不稳定、每次都要人</text>
  <line x1="450" y1="230" x2="548" y2="230" stroke="#8a8a7e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="499" y="216" text-anchor="middle" font-size="15" fill="#8a8a7e" font-weight="700">降级</text>
  <rect x="560" y="40" width="710" height="380" rx="16" fill="#e9f3ee" stroke="#3d8b70" stroke-width="2"/>
  <text x="915" y="84" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="700">结构问题</text>
  <text x="915" y="108" text-anchor="middle" font-size="14" fill="#1f6a51" font-style="italic">脚本就能判断 · 验证阶梯第 1–2 级</text>
  <rect x="590" y="135" width="380" height="60" rx="10" fill="#e9f3ee" stroke="#3d8b70" stroke-width="1.5"/>
  <text x="780" y="171" text-anchor="middle" font-size="15" fill="#1f6a51">只用了允许的组件吗？</text>
  <line x1="974" y1="165" x2="1012" y2="165" stroke="#8a8a7e" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1016" y="135" width="230" height="60" rx="10" fill="#ffffff" stroke="#3d8b70" stroke-width="1.5"/>
  <text x="1131" y="171" text-anchor="middle" font-size="14" fill="#1f6a51" font-weight="700">import 白名单</text>
  <rect x="590" y="213" width="380" height="60" rx="10" fill="#e9f3ee" stroke="#3d8b70" stroke-width="1.5"/>
  <text x="780" y="249" text-anchor="middle" font-size="15" fill="#1f6a51">只用了 DESIGN.md 的 Token 吗？</text>
  <line x1="974" y1="243" x2="1012" y2="243" stroke="#8a8a7e" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1016" y="213" width="230" height="60" rx="10" fill="#ffffff" stroke="#3d8b70" stroke-width="1.5"/>
  <text x="1131" y="249" text-anchor="middle" font-size="14" fill="#1f6a51" font-weight="700">stylelint / grep 裸色值</text>
  <rect x="590" y="291" width="380" height="60" rx="10" fill="#e9f3ee" stroke="#3d8b70" stroke-width="1.5"/>
  <text x="780" y="327" text-anchor="middle" font-size="15" fill="#1f6a51">状态流转对吗？</text>
  <line x1="974" y1="321" x2="1012" y2="321" stroke="#8a8a7e" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1016" y="291" width="230" height="60" rx="10" fill="#ffffff" stroke="#3d8b70" stroke-width="1.5"/>
  <text x="1131" y="327" text-anchor="middle" font-size="14" fill="#1f6a51" font-weight="700">reducer / 状态机单测</text>
  <text x="915" y="392" text-anchor="middle" font-size="14" fill="#8a5f1a">剩下的调性与语义，才交给人的审美判断</text>
  <text x="655" y="455" text-anchor="middle" font-size="14" fill="#8a8a7e" font-style="italic">最有杠杆的一步：先把能转换的主观问题，尽可能多地转换成结构问题</text>
</svg>
